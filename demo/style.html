<style>
[data-testid="stAppDeployButton"]{display:none}
h1,h2,h3{letter-spacing:-.025em}
.result{background:#123f3a;color:#fff;padding:24px;border-radius:8px}
.result small{color:#cfe3da}.result h3{font-family:Georgia,serif;font-weight:normal;color:white;font-size:clamp(1.6rem,3vw,2.4rem);padding:8px 0}.result b{color:#b9ecd4;font-variant-numeric:tabular-nums}
.trace{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:8px 0 16px}
.trace li{padding:6px 12px;border:1px solid #a2b6ae;border-radius:4px;overflow-wrap:anywhere}
.trace small{font-variant-numeric:tabular-nums;margin-right:4px}.trace .sel{background:#155448;color:white;font-weight:650}
</style>
<style>
.mast{display:flex;align-items:center;justify-content:space-between;padding:8px 0 14px;border-bottom:1px solid #abb7ac;gap:12px}
.mast b{font:600 22px/1.1 Georgia,serif;color:#183c35}.mast span{color:#4d655b;font:12px Consolas,monospace}
[data-testid="stMainBlockContainer"]{padding-top:2.6rem;max-width:1440px}
.trace .sel{animation:select-in .3s ease-out}
@keyframes select-in{from{outline:3px solid #a0bb77;transform:translateY(-3px)}to{outline:0 solid transparent;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.trace .sel{animation:none}}
@media(max-width:650px){.mast span{font-size:10px}.mast b{font-size:17px}}
</style>
<style>
.guide{background:#142721;color:#f1f5ed;padding:18px 24px;border-left:3px solid #add19c}.guide h2{color:inherit;margin:4px 0;font-family:Georgia,serif}.guide small{font-family:Consolas,monospace;color:#c6dec9}
.swap{display:inline-grid}.swap>*{grid-area:1/1}.swap del{opacity:0;animation:mask-out .65s both}.swap ins{text-decoration:none;animation:mask-in .65s both}
@keyframes mask-out{0%,25%{opacity:1}100%{opacity:0}}@keyframes mask-in{0%,50%{opacity:0}100%{opacity:1}}
@media(prefers-reduced-motion:reduce){.swap>*{animation:none!important}}
</style>
