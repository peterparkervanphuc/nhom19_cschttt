<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark;font:13px/1.5 "Segoe UI",sans-serif;color:#d7e7df;background:#101e1c}
*{box-sizing:border-box}body,figure{margin:0}svg{width:100%;height:auto;display:block}
figcaption{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid #40534b;padding:12px 0 0;flex-wrap:wrap}
button{background:transparent;color:inherit;border:1px solid #58736a;border-radius:4px;min-width:31px;height:30px;cursor:pointer}button:hover,button[aria-pressed=true]{background:#d3ecae;color:#122821}button:focus-visible{outline:2px solid #d7efa7;outline-offset:2px}.controls{display:flex;gap:5px}
.pulse{stroke-dasharray:.48 24.52;stroke-linecap:round;stroke-width:2.8;animation:travel 1.8s linear infinite paused}
.running .pulse{animation-play-state:running}
@media(prefers-reduced-motion:reduce){.pulse{animation-duration:5s}}
@keyframes travel{from{stroke-dashoffset:0}to{stroke-dashoffset:-25}}
</style>
<figure><svg viewBox="0 0 600 330" role="img" aria-labelledby="title desc">
<title id="title">Dòng sự kiện qua encoder</title><desc id="desc">Bốn vị trí của tiền tố truyền thông tin qua encoder đến phân phối hoạt động tiếp theo. Hình minh họa khái niệm.</desc>
<defs><pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#557369"/></pattern></defs>
<rect x="20" y="22" width="560" height="268" fill="url(#grid)" opacity=".5"/>
<g stroke="#456259" stroke-dasharray="2 6"><path d="M62 45v225M302 45v225M541 45v225"/></g>
<g fill="#b1c9bd" font-family="Consolas,monospace" font-size="11"><text x="30" y="18">TIỀN TỐ</text><text x="275" y="18">ENCODER</text><text x="510" y="18">DỰ ĐOÁN</text></g>
<g id="field"></g><g id="labels"></g>
<path d="M60 292h478l-6 -4m6 4 -6 4" stroke="#79978b" fill="none"/>
<text x="60" y="315" fill="#a4bbae" font-family="Consolas,monospace" font-size="11">Hướng truyền thông tin</text></svg>
<figcaption><div class="controls" role="group" aria-label="Vị trí trong tiền tố"></div><button id="motion">Tạm dừng</button></figcaption>
<noscript>Tiền tố → embedding → attention → pooling → phân phối dự đoán.</noscript></figure>
<script>
const root=document.querySelector('figure'), field=document.querySelector('#field'), labels=document.querySelector('#labels'), controls=document.querySelector('.controls');
const palette=['#a9d5c0','#bce99b','#67a796','#8cc3bc'];
// Each bundle follows the same topology on every visit. Depth projects into x and y.
function point(group,strand,t){
 const u=strand/33,spread=Math.sin(Math.PI*t),angle=2*Math.PI*u+.7*group+3.4*t;
 const depth=Math.cos(angle)*spread, wave=Math.sin(angle)*spread;
 const x=62+479*t+depth*15;
 const lift=Math.sin(t*Math.PI*2-.6+group*.96)*spread;
 const y=89+group*48+(1.5-group)*48*t+42*lift+wave*(20+38*spread)+depth*19;
 return [x,y];
}
const bundles=[];
for(let g=0;g<4;g++){
 let lines='',dots='';
 for(let s=0;s<34;s++){
  const pts=[];
  for(let k=0;k<=76;k++){
   const [x,y]=point(g,s,k/76);
   pts.push(x.toFixed(1)+' '+y.toFixed(1));
   if((s+k)%3===0)dots+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(k%7===0?1.2:.75)+'"/>';
  }
  if(s%3===0)lines+='<path d="M'+pts.join(' L')+'" opacity=".49" stroke-width=".64"/>';
  if(s%9===3)lines+='<path class="pulse" d="M'+pts.join(' L')+'" pathLength="100" style="animation-delay:-'+((s+g)*.17)+'s"/>';
 }
 const layer=document.createElementNS('http://www.w3.org/2000/svg','g');
 layer.innerHTML='<g fill="none" stroke="'+palette[g]+'">'+lines+'</g><g fill="'+palette[g]+'">'+dots+'</g>';
 field.append(layer);bundles.push(layer);
 const y=89+g*48;
 labels.innerHTML+='<text x="23" y="'+(y+4)+'" fill="#d0dfd3" font-size="12" font-family="Consolas">x'+(g+1)+'</text><circle cx="62" cy="'+y+'" r="4" fill="'+palette[g]+'"/>';
 const button=document.createElement('button');button.textContent='x'+(g+1);button.onclick=()=>select(g);controls.append(button);
}
labels.innerHTML+='<circle cx="541" cy="161" r="8" fill="#c7e9ab"/><circle cx="541" cy="161" r="16" stroke="#afcda6" fill="none"/>';
function select(g){bundles.forEach((layer,i)=>{layer.setAttribute('opacity',i===g?'1':'.35');controls.children[i].setAttribute('aria-pressed',String(i===g))})}
const motion=document.querySelector('#motion'); let playing=true,onScreen=true;
function sync(){
 root.classList.toggle('running',playing&&onScreen&&!document.hidden);
 motion.textContent=playing?'Tạm dừng':'Tiếp tục';
}
motion.onclick=()=>{playing=!playing;sync()};
document.onvisibilitychange=sync;
const observer=new IntersectionObserver(([entry])=>{onScreen=entry.isIntersecting;sync()});observer.observe(root);window.onpagehide=()=>observer.disconnect();select(1);sync();
</script></html>
